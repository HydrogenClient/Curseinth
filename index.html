<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curseinth</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: #fff;
    }
    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #15151f;
    }
    a {
      color: #7aa2ff;
      text-decoration: none;
    }
    .hero {
      text-align: center;
      padding: 100px 20px;
    }
    .hero h1 {
      font-size: 3rem;
    }
    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 14px 22px;
      border-radius: 8px;
      background: #7aa2ff;
      color: #000;
      font-weight: bold;
    }
    .buttons a.secondary {
      background: #2a2a3a;
      color: #fff;
    }
  </style>
</head>
<body>

<header>
  <h2>Curseinth</h2>
  <a href="login.html">Login</a>
</header>

<section class="hero">
  <h1>Minecraft Mods.<br>Powered by GitHub.</h1>
  <p>Fabric & Forge mods. Open, transparent, and developer-first.</p>
  <div class="buttons">
    <a href="browse.html">Browse Mods</a>
    <a href="login.html" class="secondary">Publish a Mod</a>
  </div>
</section>

</body>
</html>
