<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browse Mods - Curseinth</title>
  <style>
    body {
      background: #0f0f14;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: #15151f;
      padding: 20px;
      border-radius: 12px;
    }
    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      background: #2a2a3a;
      border-radius: 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<h1>Browse Mods</h1>

<div class="grid">
  <div class="card">
    <h3>Example Mod</h3>
    <p>A cool Fabric & Forge mod.</p>
    <span class="tag">Fabric</span>
    <span class="tag">Forge</span>
    <span class="tag">1.20.1</span>
  </div>
</div>

</body>
</html>
