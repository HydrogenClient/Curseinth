<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Curseinth</title>
  <style>
    body {
      background: #0f0f14;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #15151f;
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
    .btn {
      display: block;
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
    }
    .github {
      background: #fff;
      color: #000;
    }
    .google {
      background: #4285F4;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Sign in to Curseinth</h2>
  <a class="btn github" href="/auth/github">
    Sign in with GitHub
  </a>
  <a class="btn google" href="/auth/google">
    Sign in with Google
  </a>
</div>

</body>
</html>
